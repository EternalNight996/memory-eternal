<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>memory-eternal · 在线 Demo</title>
<link rel="icon" type="image/png" href="../assets/icon.png" />
<style>
  :root {
    --bg: #1e2228;
    --bg-deep: #171a1f;
    --surface: #262b33;
    --surface-2: #2f353e;
    --surface-3: #343a43;
    --line: rgba(255,255,255,.11);
    --line-strong: rgba(255,255,255,.18);
    --text: #f3f5f8;
    --text-2: #b0b7c1;
    --text-3: #99a1ac;
    --ember: #ff7a45;
    --ember-2: #ff9a72;
    --ember-soft: rgba(255,122,69,.10);
    --green: #4ade80;
    --amber: #fbbf24;
    --rose: #fb7185;
    --blue: #7aa2ff;
    --violet: #b79cff;
    --cyan: #67e8f9;
    --pink: #f472b6;
    --k-project: #7aa2ff;
    --k-knowledge: #b79cff;
    --k-mistake: #fb7185;
    --k-content: #f472b6;
    --k-tool: #67e8f9;
    --k-prompt: #fbbf24;
    --k-business: #ff7a45;
    --font: "Inter", "SF Pro Text", "Segoe UI", "MiSans", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "SFMono-Regular", "Cascadia Code", "Consolas", "Liberation Mono", monospace;
    --radius: 13px;
    --shadow: 0 18px 50px rgba(0,0,0,.42);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 13px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: rgba(255,122,69,.32); color: #fff; }
  :focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 6px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2f36; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3a4048; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-columns: 228px minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  .app.collapsed { grid-template-columns: 68px minmax(0, 1fr); }

  /* ---------------- rail ---------------- */
  .rail {
    display: flex; flex-direction: column; min-height: 0; padding: 14px 12px 12px; overflow-y: auto;
    border-right: 1px solid var(--line);
    background:
      radial-gradient(300px 240px at 0% 0%, rgba(255,122,69,.05), transparent 70%),
      linear-gradient(180deg, #0e1013 0%, #0b0c0e 100%);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; min-height: 40px; }
  .brand-mark { width: 30px; height: 30px; flex: none; object-fit: cover; border-radius: 8px; background: #fff; padding: 1px; filter: drop-shadow(0 0 10px rgba(255,122,69,.18)); }
  .brand-text { min-width: 0; }
  .brand-name { font-size: 14px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; }
  .brand-sub { margin-top: 2px; font-size: 9px; letter-spacing: .16em; color: var(--text-3); text-transform: uppercase; white-space: nowrap; }
  .rail-toggle {
    margin-left: auto; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; color: var(--text-3); flex: none;
  }
  .rail-toggle:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .rail-toggle svg { width: 14px; height: 14px; transition: transform .18s ease; }
  .app.collapsed .rail-toggle svg { transform: rotate(180deg); }
  .nav-label { padding: 14px 10px 6px; font-size: 9.5px; letter-spacing: .15em; color: var(--text-3); font-weight: 600; text-transform: uppercase; }
  .nav-item {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 37px;
    padding: 0 10px; border-radius: 9px; color: var(--text-2); font-size: 12.5px; font-weight: 500;
    transition: background .14s ease, color .14s ease;
  }
  .nav-item .ico { width: 17px; height: 17px; flex: none; opacity: .9; }
  .nav-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .nav-item.active { color: #fff; background: linear-gradient(90deg, rgba(255,122,69,.13), rgba(255,122,69,.04)); box-shadow: inset 0 0 0 1px rgba(255,122,69,.16); }
  .nav-item.active .ico { color: var(--ember); opacity: 1; }
  .nav-item .lbl { white-space: nowrap; overflow: hidden; }
  .nav-item .count {
    margin-left: auto; min-width: 18px; height: 17px; padding: 0 5px; border-radius: 5px;
    background: rgba(255,255,255,.07); color: var(--text-2); font-size: 10px; line-height: 17px;
    text-align: center; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .nav-item .count.hot { background: rgba(255,122,69,.16); color: var(--ember-2); }
  .nav-item .count.cool { background: rgba(255,255,255,.06); color: var(--text-3); }
  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .rail-foot { margin-top: auto; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .rail-health {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; background: rgba(255,255,255,.018);
  }
  .rail-health .rh-top { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(74,222,128,.12); flex: none; }
  .rail-health .rh-note { margin-top: 6px; font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .rail-version { display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 10px; color: var(--text-3); }
  .rail-version .mono { font-family: var(--mono); }
  .app.collapsed .brand-text, .app.collapsed .nav-label, .app.collapsed .nav-item .lbl,
  .app.collapsed .nav-item .count, .app.collapsed .rail-health, .app.collapsed .rail-version span { display: none; }
  .app.collapsed .rail-toggle { margin-left: 0; }
  .app.collapsed .brand { justify-content: center; flex-wrap: wrap; gap: 6px; }
  .app.collapsed .nav-item { justify-content: center; padding: 0; }
  .app.collapsed .rail-foot { align-items: center; }
  .app.collapsed .rail-version .mono { display: none; }

  /* ---------------- main / topbar ---------------- */
  .main {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background:
      radial-gradient(1100px 560px at 12% -12%, rgba(255,122,69,.055), transparent 62%),
      radial-gradient(900px 500px at 100% 0%, rgba(122,162,255,.035), transparent 60%),
      var(--bg);
  }
  .topbar {
    flex: none; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 32px;
    border-bottom: 1px solid rgba(255,255,255,.055); background: rgba(11,12,14,.55); backdrop-filter: blur(14px);
  }
  .crumb { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
  .crumb b { color: var(--text); font-weight: 550; }
  .crumb .sep { opacity: .45; }
  .topbar .spacer { flex: 1; }
  .sys-pill { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 10.5px; color: var(--text-2); white-space: nowrap; }
  .sys-pill .pulse { width: 5px; height: 5px; }
  .demo-flag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid rgba(251,191,36,.22); border-radius: 5px; background: rgba(251,191,36,.07); color: var(--amber); font-size: 9.5px; letter-spacing: .04em; white-space: nowrap; }
  .icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-3); }
  .icon-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }
  .mobile-brand { display: none; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; }
  .mobile-brand .brand-mark { width: 24px; height: 24px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 31px; padding: 0 11px;
    border: 1px solid var(--line-strong); border-radius: 8px; background: transparent; color: var(--text-2);
    font-size: 11.5px; font-weight: 500; white-space: nowrap; transition: background .14s ease, color .14s ease, border-color .14s ease, transform .08s ease;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:hover { background: rgba(255,255,255,.045); color: var(--text); border-color: rgba(255,255,255,.2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--ember); border-color: transparent; color: #1b0d07; font-weight: 650; box-shadow: 0 6px 20px rgba(255,122,69,.18); }
  .btn.primary:hover { background: #ff8b5c; color: #1b0d07; }
  .btn.danger { color: var(--rose); border-color: rgba(251,113,133,.26); }
  .btn.danger:hover { background: rgba(251,113,133,.08); border-color: rgba(251,113,133,.4); }
  .btn.ghost { border-color: transparent; color: var(--text-3); }
  .btn.ghost:hover { color: var(--text); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.lg { height: 38px; padding: 0 15px; font-size: 12.5px; border-radius: 9px; }

  .scroll { flex: 1; min-height: 0; overflow: auto; }
  .view { display: none; width: 100%; max-width: 1520px; margin: 0 auto; padding: 26px 32px 60px; }
  .view.active { display: block; animation: viewIn .22s ease both; }
  .view-audit.active { display: flex; flex-direction: column; height: calc(100dvh - 60px); padding: 22px 32px 22px; }
  .view-graph.active { display: block; max-width: none; padding: 0; height: calc(100dvh - 60px); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(4px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  @keyframes nodeIn { from { opacity: 0; transform: scale(.4); } }

  /* ---------------- page head ---------------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
  .eyebrow { font-size: 9.5px; letter-spacing: .18em; color: var(--text-3); font-weight: 650; text-transform: uppercase; margin-bottom: 9px; }
  h1 { margin: 0; font-size: 27px; line-height: 1.12; letter-spacing: -.022em; font-weight: 650; }
  .sub { margin: 10px 0 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--text-2); font-size: 12px; }
  .sub b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sub .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--text-3); }
  .sub .link { color: var(--amber); border-bottom: 1px dashed rgba(251,191,36,.3); }
  .sub .link:hover { border-bottom-style: solid; }
  .trust {
    display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 10.5px; color: var(--text-3); white-space: nowrap;
  }
  .trust svg { width: 13px; height: 13px; color: var(--text-3); }

  /* ---------------- library ---------------- */
  .command {
    display: flex; align-items: center; gap: 10px; height: 46px; max-width: 720px; padding: 0 13px;
    border: 1px solid var(--line-strong); border-radius: 11px; background: rgba(255,255,255,.025);
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .command:focus-within { border-color: rgba(255,122,69,.55); box-shadow: 0 0 0 3px rgba(255,122,69,.09); background: rgba(255,255,255,.035); }
  .command > svg { width: 17px; height: 17px; color: var(--text-3); flex: none; }
  .command input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 13px; }
  .command input::placeholder { color: var(--text-3); }
  .command .kbd { flex: none; }
  .command .clear { display: none; color: var(--text-3); width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 5px; }
  .command.has-q .clear { display: flex; }
  .command .clear:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .kbd {
    font-family: var(--mono); font-size: 9.5px; color: var(--text-3); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; line-height: 1.2; white-space: nowrap;
  }
  .filters { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 16px 0 18px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 9px; border-radius: 7px;
    border: 1px solid transparent; color: var(--text-2); font-size: 11.5px; white-space: nowrap;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }
  .chip .n { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .chip svg { width: 12px; height: 12px; flex: none; }
  .chip:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .chip.active { background: var(--ember-soft); border-color: rgba(255,122,69,.22); color: var(--ember-2); }
  .chip.active .n { color: rgba(255,154,114,.78); }
  .filters .grow { flex: 1; min-width: 8px; }
  .select-wrap { position: relative; display: inline-flex; align-items: center; }
  .select-wrap svg { position: absolute; right: 8px; width: 12px; height: 12px; color: var(--text-3); pointer-events: none; }
  select.mc-select {
    appearance: none; -webkit-appearance: none; height: 27px; padding: 0 26px 0 9px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: 11.5px; cursor: pointer;
  }
  select.mc-select:hover { border-color: var(--line-strong); color: var(--text); }
  select.mc-select option { background: #171a1e; color: var(--text); }
  .result-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; font-size: 10.5px; color: var(--text-3); }
  .result-line b { color: var(--text-2); font-weight: 550; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(266px, 1fr)); gap: 11px; }
  .card {
    --c: var(--ember);
    position: relative; display: flex; flex-direction: column; min-height: 214px; padding: 13px 14px 11px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,0) 44%), var(--surface);
    cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    animation: fadeIn .25s ease both;
  }
  .card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, var(--c), transparent 58%); opacity: .42; transition: opacity .18s ease;
  }
  .card::after {
    content: ""; position: absolute; left: -55px; top: -80px; width: 210px; height: 170px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--c) 12%, transparent), transparent);
    opacity: 0; transition: opacity .22s ease; pointer-events: none;
  }
  .card:hover {
    transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 42%, var(--line));
    box-shadow: 0 16px 40px rgba(0,0,0,.38), 0 0 0 1px color-mix(in srgb, var(--c) 10%, transparent);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 44%), var(--surface);
  }
  .card:hover::before { opacity: 1; }
  .card:hover::after { opacity: 1; }
  .card:focus-visible { border-color: var(--ember); outline: 2px solid rgba(255,122,69,.38); outline-offset: 2px; }
  .card.pinned { border-color: rgba(255,122,69,.26); background: linear-gradient(180deg, rgba(255,122,69,.05), rgba(255,255,255,0) 46%), var(--surface); }

  .card-top { display: flex; align-items: center; gap: 7px; min-height: 26px; }
  .kind-tile {
    width: 24px; height: 24px; border-radius: 7px; flex: none; display: flex; align-items: center; justify-content: center;
    color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 18%, transparent);
  }
  .kind-tile svg { width: 13px; height: 13px; }
  .kind { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; color: var(--text-2); min-width: 0; }
  .kind .k-sep { color: var(--text-3); opacity: .6; }
  .kind .k-tag { color: var(--text-3); font-weight: 500; letter-spacing: 0; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-time { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .new-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 8px rgba(255,122,69,.6); }
  .pin-btn {
    width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 6px;
    color: var(--text-3); opacity: 0; transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .pin-btn svg { width: 12px; height: 12px; }
  .card:hover .pin-btn, .card:focus-within .pin-btn, .pin-btn.on { opacity: 1; }
  .pin-btn:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .pin-btn.on { color: var(--ember); }
  .status-pill { font-size: 9px; letter-spacing: .03em; padding: 2px 5px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
  .status-pill.pending { color: var(--amber); background: rgba(251,191,36,.09); border: 1px solid rgba(251,191,36,.18); }

  .card h3 {
    margin: 10px 0 0; font-size: 15px; line-height: 1.48; font-weight: 600; letter-spacing: -.006em; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .card p {
    margin: 7px 0 0; font-size: 12.5px; line-height: 1.64; color: var(--text-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .card-insight {
    margin: 7px 0 0; display: flex; gap: 7px; align-items: flex-start; min-width: 0;
    border-left: 2px solid color-mix(in srgb, var(--c) 55%, transparent); padding-left: 8px;
  }
  .insight-k { flex: none; font-size: 9.5px; line-height: 1.7; font-weight: 650; letter-spacing: .03em; color: var(--c); }
  .insight-t {
    min-width: 0; font-size: 12px; line-height: 1.64; color: var(--text-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .feat-k { color: var(--ember-2); font-size: 9.5px; font-weight: 650; letter-spacing: .03em; margin-right: 6px; }
  mark { background: rgba(255,122,69,.24); color: #fff; border-radius: 2px; padding: 0 1px; }

  .card-tags { display: flex; align-items: center; gap: 5px; margin-top: 10px; min-width: 0; overflow: hidden; white-space: nowrap; }
  .card-tag {
    font-size: 10px; color: var(--text-3); padding: 2px 6px; border-radius: 5px; border: 1px solid transparent;
    background: rgba(255,255,255,.028); max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .14s ease, border-color .14s ease, background .14s ease;
  }
  .card-tag:hover { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,.06); }
  .card-tag.on { color: var(--ember-2); border-color: rgba(255,122,69,.26); background: var(--ember-soft); }
  .card-tag.more { background: none; padding-left: 1px; color: var(--text-3); }

  .card-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .conn {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px 0 3px; border-radius: 5px;
    color: var(--text-3); font-size: 10px; white-space: nowrap; transition: color .14s ease, background .14s ease;
  }
  .conn:hover { color: var(--text); background: rgba(255,255,255,.045); }
  .conn svg.mini { width: 27px; height: 18px; flex: none; }
  .conn b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-src { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); font-size: 9.5px; flex: none; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-src svg { width: 10px; height: 10px; flex: none; }

  .card-actions {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 5px;
    padding: 10px 11px 9px; background: linear-gradient(180deg, transparent 0%, var(--surface) 38%);
    opacity: 0; transform: translateY(5px); pointer-events: none; transition: opacity .16s ease, transform .16s ease;
  }
  .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; transform: none; pointer-events: auto; }
  .card-actions .act {
    height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line);
    background: rgba(14,16,20,.92); color: var(--text-2); font-size: 10px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .card-actions .act svg { width: 11px; height: 11px; }
  .card-actions .act:hover { color: var(--text); border-color: var(--line-strong); background: var(--surface-2); }

  .inline-tag { color: var(--ember-2); border-bottom: 1px dashed rgba(255,122,69,.34); font-size: 10.5px; }

  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 70px 20px 90px; }

  /* ---------------- audit ---------------- */
  .audit { display: grid; grid-template-columns: 332px minmax(0, 1fr); gap: 13px; flex: 1; min-height: 0; }
  .audit-top { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-bottom: 11px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

  .audit-top #auditTypeList { display: flex; flex-wrap: wrap; gap: 4px; }
  .audit-top .audit-type { width: auto; padding: 3px 7px; font-size: 10.5px; border-radius: 6px; }
  .audit-types { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 11px 8px; }
  .audit-types .side-label { margin: 2px 7px 8px; }
  .audit-type { display: flex; align-items: center; gap: 7px; width: 100%; padding: 6px 7px; border: 1px solid transparent; border-radius: 7px; color: var(--text-2); font-size: 11px; text-align: left; }
  .audit-type:hover { background: rgba(255,255,255,.035); color: var(--text); }

  .at-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--c); flex: none; }
  .at-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .audit-type b { min-width: 18px; padding: 0 5px; border-radius: 5px; background: rgba(255,255,255,.06); color: var(--text-3); font-size: 9.5px; line-height: 16px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .audit-batch { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }

  .btn.small { height: 25px; padding: 0 8px; font-size: 9.5px; gap: 4px; }

  .q-check { display: flex; align-items: center; flex: none; cursor: pointer; }

  .queue, .preview { min-height: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .queue { display: flex; flex-direction: column; }

  .queue-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
  .queue-title .count-pill { height: 18px; padding: 0 6px; border-radius: 5px; background: rgba(255,122,69,.14); color: var(--ember-2); font-size: 10px; line-height: 18px; font-variant-numeric: tabular-nums; }
  .queue-title .meta { margin-left: auto; font-size: 10px; color: var(--text-3); font-weight: 400; }
  .qsearch { display: flex; align-items: center; gap: 7px; height: 31px; margin-top: 10px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02); }
  .qsearch svg { width: 13px; height: 13px; color: var(--text-3); flex: none; }
  .qsearch input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 11.5px; }
  .qsearch input::placeholder { color: var(--text-3); }
  .queue-list { flex: 1; overflow: auto; padding: 6px; }
  .q-item { padding: 9px 10px 10px; border-radius: 9px; border-left: 2px solid transparent; cursor: pointer; transition: background .12s ease; }
  .q-item:hover { background: rgba(255,255,255,.03); }
  .q-item.active { background: linear-gradient(90deg, rgba(255,122,69,.10), rgba(255,122,69,.02)); border-left-color: var(--ember); }
  .q-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }

  .q-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 9.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }

  .preview-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .preview-head h2 { margin: 0; font-size: 20px; line-height: 1.35; letter-spacing: -.012em; font-weight: 650; overflow-wrap: anywhere; }
  .preview-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .meta-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.02); font-size: 10px; color: var(--text-2); white-space: nowrap; }

  .preview-body { padding: 4px 26px 30px; }
  .preview-insight { margin: 10px 0 14px; padding: 9px 12px; border-left: 2px solid var(--ember); border-radius: 0 6px 6px 0; background: rgba(255,122,69,.05); font-size: 11.5px; line-height: 1.7; color: var(--text-2); }
  .pv-k { color: var(--ember-2); font-weight: 650; margin-right: 6px; font-size: 9.5px; letter-spacing: .04em; }
  .decision { flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px solid var(--line); background: rgba(0,0,0,.16); }
  .decision .hint { margin-left: auto; font-size: 9.5px; color: var(--text-3); letter-spacing: .01em; white-space: nowrap; }

  /* ---------------- graph ---------------- */
  .graph { position: relative; height: 100%; overflow: hidden; background:
      radial-gradient(880px 620px at 62% 44%, rgba(255,122,69,.06), transparent 66%),
      radial-gradient(720px 520px at 16% 82%, rgba(122,162,255,.05), transparent 66%),
      radial-gradient(700px 520px at 88% 84%, rgba(183,156,255,.04), transparent 66%),
      #090a0c;
  }
  .graph > svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  .graph > svg.dragging { cursor: grabbing; }
  .graph-grid { position: absolute; inset: 0; opacity: .35; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(circle at 55% 48%, #000 20%, transparent 78%);
  }
  .graph-title { position: absolute; left: 28px; top: 24px; z-index: 3; pointer-events: none; }
  .graph-title h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .graph-title p { margin: 6px 0 0; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .legend { position: absolute; left: 28px; top: 96px; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: rgba(13,15,18,.66); backdrop-filter: blur(12px); }
  .legend button { display: flex; align-items: center; gap: 8px; height: 27px; padding: 0 8px; border-radius: 6px; font-size: 10.5px; color: var(--text-2); white-space: nowrap; }
  .legend button:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .legend button.off { opacity: .38; }
  .legend i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px color-mix(in srgb, var(--c) 62%, transparent); }
  .legend .n { margin-left: auto; color: var(--text-3); font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .graph-tools { position: absolute; top: 22px; right: 24px; z-index: 3; display: flex; gap: 7px; }
  .graph-tools .graph-icon { width: 31px; padding: 0; justify-content: center; font-size: 15px; line-height: 1; }
  .graph-tools .btn { background: rgba(13,15,18,.72); backdrop-filter: blur(12px); }
  .graph-search { display: flex; align-items: center; gap: 7px; width: 260px; height: 31px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(13,15,18,.72); backdrop-filter: blur(12px); }
  .graph-search svg { width: 13px; height: 13px; color: var(--text-3); }
  .graph-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 11px; }
  .graph-search input::placeholder { color: var(--text-3); }
  .inspector {
    position: absolute; top: 70px; right: 24px; width: 304px; max-height: calc(100% - 94px); overflow: auto; z-index: 4;
    padding: 16px; border: 1px solid var(--line-strong); border-radius: 13px; background: rgba(16,18,22,.86);
    backdrop-filter: blur(18px); box-shadow: var(--shadow); display: none;
  }
  .inspector.show { display: block; animation: popIn .2s ease both; }
  .inspector h3 { margin: 9px 0 0; font-size: 14px; line-height: 1.45; font-weight: 600; overflow-wrap: anywhere; }
  .inspector .ins-sum { margin: 8px 0 0; font-size: 11px; line-height: 1.65; color: var(--text-2); }
  .inspector .ins-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 10.5px; color: var(--text-3); }
  .inspector .ins-row b { color: var(--text-2); font-weight: 500; text-align: right; overflow-wrap: anywhere; }
  .inspector .ins-close { position: absolute; top: 12px; right: 12px; }
  .inspector .ins-actions { display: flex; gap: 7px; margin-top: 12px; }
  .graph-hint { position: absolute; left: 28px; bottom: 18px; z-index: 3; display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--text-3); letter-spacing: .02em; pointer-events: none; }
  .graph-hint svg { width: 12px; height: 12px; flex: none; }
  .graph-hint b { color: var(--text-2); font-weight: 550; }
  .graph-tip { position: fixed; z-index: 60; pointer-events: none; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 7px; background: rgba(20,23,28,.96); font-size: 10.5px; color: var(--text); max-width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,.45); display: none; }
  .graph-tip small { display: block; margin-top: 3px; color: var(--text-3); font-size: 9.5px; }

  .gnode { cursor: grab; }
  .gnode:active { cursor: grabbing; }
  .gnode circle { transition: opacity .18s ease, r .18s ease; }
  .gnode text { pointer-events: none; transition: opacity .18s ease; }
  .gnode.dim { opacity: .12; }
  .gnode.dim circle { opacity: .35; }
  .gnode.sel circle.node { stroke: #fff; stroke-width: 1.4; }
  .gnode:hover circle.node { stroke: rgba(255,255,255,.7); stroke-width: 1; }
  .graph.legend-focus .gnode.dim { opacity: .08; }

  /* ---------------- status ---------------- */
  .status-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
  .status-card { position: relative; padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(180deg, rgba(255,255,255,.02), transparent 60%), var(--surface); }
  .status-card .sc-head { display: flex; align-items: center; gap: 7px; font-size: 10.5px; color: var(--text-2); }
  .status-card .sc-head svg { width: 14px; height: 14px; color: var(--text-3); }
  .status-card .sc-head .ok { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(74,222,128,.6); }
  .status-card .sc-value { margin-top: 11px; font-size: 18px; line-height: 1.2; font-weight: 650; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .status-card .sc-note { margin-top: 5px; font-size: 10px; color: var(--text-3); overflow-wrap: anywhere; }
  .status-cols { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(0,1fr); gap: 12px; align-items: start; }
  .panel { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }

  .panel-head .meta { margin-left: auto; font-size: 9.5px; color: var(--text-3); }

  .panel-head .seg button { height: 20px; padding: 0 7px; border-radius: 4px; font-size: 9.5px; color: var(--text-3); }
  .panel-head .seg button.active { background: rgba(255,255,255,.08); color: var(--text); }
  .panel-body { padding: 6px; }
  .timeline { max-height: 536px; overflow: auto; }
  .tl-row { display: flex; gap: 10px; padding: 8px; border-radius: 7px; }
  .tl-row:hover { background: rgba(255,255,255,.022); }
  .tl-time { flex: none; width: 38px; padding-top: 1px; font-size: 9.5px; color: var(--text-3); font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .tl-mark { flex: none; width: 8px; height: 8px; margin-top: 4px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px color-mix(in srgb, var(--c) 50%, transparent); }
  .tl-text { min-width: 0; font-size: 11px; line-height: 1.55; color: var(--text-2); overflow-wrap: anywhere; }
  .tl-text b { color: var(--text); font-weight: 550; }
  .tl-text .preview { display: block; margin-top: 2px; color: var(--text-3); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-list { display: flex; flex-direction: column; gap: 2px; }
  .side-item { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 7px; cursor: pointer; min-width: 0; }
  .side-item:hover { background: rgba(255,255,255,.03); }
  .side-item .si-title { flex: 1; min-width: 0; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item .si-time { flex: none; font-size: 9px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .side-item:hover .si-title { color: var(--text); }
  .checkline { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--text-3); }
  .checkline .btn { margin-left: auto; height: 25px; font-size: 10px; }

  /* ---------------- reader ---------------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 26px; background: rgba(4,5,7,.66); backdrop-filter: blur(10px); animation: fadeIn .16s ease both; }

  .guide-overlay { z-index: 70; }

  .support-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--line); }
  .support-head h3 { margin: 0; font-size: 14px; font-weight: 650; }

  .support-tabs { display: flex; gap: 5px; padding: 10px 18px 0; border-bottom: 1px solid var(--line); }

  .support-tab:hover { color: var(--text); }
  .support-tab.active { color: var(--text); border-bottom-color: var(--ember); font-weight: 600; }
  .support-body { flex: 1; min-height: 0; overflow: auto; padding: 17px 18px 20px; }
  .support-note { margin: 0 0 12px; font-size: 11.5px; line-height: 1.75; color: var(--text-2); }

  .support-qr img { display: block; width: 200px; max-width: 42vw; padding: 6px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  .support-qr figcaption { margin-top: 6px; font-size: 10px; color: var(--text-3); text-align: center; }
  .support-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 18px 15px; border-top: 1px solid var(--line); }
  .support-link { color: var(--ember-2); font-size: 11.5px; }
  .support-link:hover { text-decoration: underline; }
  .guide { width: min(620px, 96vw); border: 1px solid var(--line-strong); border-radius: 16px; background: #111317; box-shadow: 0 40px 120px rgba(0,0,0,.65); animation: popIn .22s cubic-bezier(.2,.8,.2,1) both; }
  .guide-head { display: flex; align-items: center; gap: 10px; padding: 17px 20px 9px; }
  .guide-head b { font-size: 14.5px; }
  .guide-head span { margin-left: auto; font-size: 10px; color: var(--text-3); }
  .guide-dots { display: flex; gap: 5px; padding: 0 20px 5px; }
  .guide-dot { width: 18px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.13); }
  .guide-dot.on { background: var(--ember); }
  .guide-body { padding: 12px 20px 7px; }
  .guide-body h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.35; font-weight: 650; }
  .guide-body p { margin: 0; font-size: 12px; line-height: 1.8; color: var(--text-2); }
  .guide-like { display: inline-flex; align-items: center; gap: 9px; margin-top: 15px; padding: 10px 17px; border: 1px solid rgba(74,222,128,.3); border-radius: 10px; background: rgba(74,222,128,.08); color: var(--green); font-size: 15px; font-weight: 650; animation: guidePulse 1.8s ease-in-out infinite; }
  .guide-like .thumb { font-size: 27px; line-height: 1; }
  @keyframes guidePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } 50% { box-shadow: 0 0 0 8px rgba(74,222,128,.1); } }
  .guide-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .guide-chips span { padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--text-2); font-size: 10.5px; }

  function setView(v) {
    if (!VIEW_NAMES[v] && v !== 'recycle' && v !== 'config') v = 'library';

    // 视图与 URL hash 保持同步：导航 / 快捷键 / 审核返回等任意切换都能直接复制地址

  function mountEmpty(viewEl) {

  // ---------------- library ----------------
  function libraryList() {
    ensureConn();
    var q = state.q.trim().toLowerCase();
    return D.approved.filter(function (c) {
      if (state.onlyPinned && !state.pinned.has(c.path)) return false;
      if (state.tag && (c.tags || []).indexOf(state.tag) < 0) return false;
      if (state.kind !== 'all' && c.kind !== state.kind) return false;
      if (state.agent !== 'all' && (c.submittedBy || '') !== state.agent) return false;
      if (q) {
        var hay = (c.title + ' ' + (c.tags || []).join(' ') + ' ' + cleanSummary(c)).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      var pa = state.pinned.has(a.path) ? 1 : 0;
      var pb = state.pinned.has(b.path) ? 1 : 0;
      if (pa !== pb) return pb - pa;
      if (state.sort === 'title') return String(a.title).localeCompare(String(b.title), 'zh');
      if (state.sort === 'connections') return (CONN[b.path] || 0) - (CONN[a.path] || 0);
      if (state.sort === 'hot') return (b.tags || []).length - (a.tags || []).length;
      return new Date(b.updated).getTime() - new Date(a.updated).getTime();
    });
  }

  function kindCount(k) {
    if (k === 'all') return D.total;
    return (D.byKind && D.byKind[k]) || 0;
  }

        '<span class="select-wrap"><select class="mc-select" id="sortSel"><option value="recent">最近更新</option><option value="connections">连接最多</option><option value="title">标题</option><option value="hot">标签最多</option></select>' + icon('chevron') + '</span>' +

  function cardHtml(c, i) {

  function bindCards(grid, list, feature) {
    var byPath = {};
    list.forEach(function (c) { byPath[c.path] = c; });
    if (feature) byPath[feature.card.path] = feature.card;
    $$('.card', grid).forEach(function (el) {
      var path = el.getAttribute('data-path');
      var isFeature = el.getAttribute('data-feature') === '1';
      var card = byPath[path];
      el.onclick = function (e) {
        if (e.target.closest('button')) return;
        openReader(path, isFeature ? D.oldCards : list);
      };
      el.onkeydown = function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openReader(path, isFeature ? D.oldCards : list);
        }
      };
      $$('[data-pin]', el).forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); togglePin(path); };
      });
      $$('[data-tag]', el).forEach(function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          state.tag = state.tag === b.getAttribute('data-tag') ? '' : b.getAttribute('data-tag');
          updateLibrary();
          $('#scroll').scrollTop = 0;
        };
      });
      $$('[data-graph]', el).forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); openInGraph(path); };
      });
      $$('[data-open]', el).forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); openReader(path, isFeature ? D.oldCards : list); };
      });
      $$('[data-copy]', el).forEach(function (b) {
        b.onclick = function (e) {
          e.stopPropagation();
          if (card) copyText(card.title + '\n\n' + cleanSummary(card), '卡片摘要已复制');
        };
      });
      if (isFeature) {
        $$('[data-feature-open]', el).forEach(function (b) {
          b.onclick = function (e) { e.stopPropagation(); openReader(path, D.oldCards); };
        });
        $$('[data-feature-next]', el).forEach(function (b) {
          b.onclick = function (e) {
            e.stopPropagation();
            state.featureIdx++;
            updateLibrary();
            showToast('换了一张旧记忆');
          };
        });
      }
    });
  }

  function openInGraph(path) {
    setView('graph');
    setTimeout(function () {
      if (!graphData) { showToast('星图还没有准备好'); return; }
      var id = 'c:' + path;
      var node = graphData.nodes.filter(function (n) { return n.id === id; })[0];
      var g = $$('.gnode', $('#graphSvg')).filter(function (n) { return n.getAttribute('data-id') === id; })[0];
      if (node && g) { centerOnNode(node); selectGraphNode(node, g); showToast('已在星图中定位这张卡'); }
      else showToast('这张卡不在当前星图快照里');
    }, 90);
  }

  function updateLibrary() {
    var grid = $('#grid');
    if (!grid) return;
    ensureConn();
    ensureFeature();
    var list = libraryList();
    var feature = showFeature() ? currentFeature() : null;
    var result = $('#resultText');
    if (result) {
      var bits;
      if (state.q.trim()) bits = '找到 <b>' + list.length + '</b> 张与「' + esc(state.q.trim()) + '」相关的卡';
      else if (state.onlyPinned) bits = '<b>' + list.length + '</b> 张已固定';
      else bits = '共 <b>' + D.total + '</b> 张 · 当前显示 <b>' + list.length + '</b> 张';
      if (state.tag) bits += ' · <button class="inline-tag" id="clearTag">#' + esc(state.tag) + ' ×</button>';
      if (feature) bits += ' · 今日回看 1 张';
      result.innerHTML = bits;
      var ct = $('#clearTag');
      if (ct) ct.onclick = function () { state.tag = ''; updateLibrary(); };
    }
    var pc = $('#pinCount');
    if (pc) pc.textContent = state.pinned.size;

      var title = state.onlyPinned ? '还没有固定任何卡' : state.tag ? '没有带这个标签的卡' : state.q.trim() ? '没有找到相关的记忆' : '没有更多记忆';

        '<h3>' + title + '</h3><p>' + sub + '</p>' +
        '<div class="row"><button class="btn" id="emptyClear">清除筛选</button><button class="btn primary" id="emptyRecord">+ 记录一张</button></div></div>';
      var ec = $('#emptyClear');

  function buildGraph() {

    var tagCount = {};
    cards.forEach(function (c) { (c.tags || []).forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; }); });
    var tags = Object.keys(tagCount).sort(function (a, b) { return tagCount[b] - tagCount[a]; }).slice(0, 30);
    var byTheme = {};
    THEMES.forEach(function (t) { byTheme[t.id] = []; });
    cards.forEach(function (c) {
      var th = themeOf(c);

    });
    var tagNodes = {};
    tags.forEach(function (t) {
      var related = cards.filter(function (c) { return (c.tags || []).indexOf(t) >= 0; });
      var th = themeOf(related[0] || { title: t, tags: [] });

  // 节点多时默认收一点先看全局；节点少时保持接近铺满，避免 Demo 显得空。
  var graphRefs = null;
  var graphSim = { raf: 0, alpha: 0, running: false, fitOnEnd: false };
  var nodeDrag = null;
  var dragMoved = false;

  function applyGraphView() {
    var g = $('#gViewport');
    if (g) g.setAttribute('transform', 'translate(' + graphView.x.toFixed(2) + ',' + graphView.y.toFixed(2) + ') scale(' + graphView.k.toFixed(4) + ')');
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function svgPoint(clientX, clientY) {
    var svg = $('#graphSvg');
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function worldPoint(clientX, clientY) {
    var g = $('#gViewport');
    var pt = $('#graphSvg').createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(g.getScreenCTM().inverse());
  }
  function zoomAt(clientX, clientY, factor) {
    graphSim.fitOnEnd = false;
    var p = svgPoint(clientX, clientY);
    var oldK = graphView.k;
    var k = clamp(oldK * factor, .35, 3);
    var wx = (p.x - graphView.x) / oldK;
    var wy = (p.y - graphView.y) / oldK;
    graphView.k = k;
    graphView.x = p.x - wx * k;
    graphView.y = p.y - wy * k;
    applyGraphView();
  }
  function fitView(scale) {
    if (!graphData) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    graphData.nodes.forEach(function (n) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); });
    var w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    var k = clamp(Math.min(1140 / (w + 90), 720 / (h + 90)), .35, 1.8);
    var factor = (typeof scale === 'number') ? scale : (graphData.nodes.length > 120 ? .78 : .94);
    graphView.k = clamp(k * factor, .3, 1.8);
    graphView.x = 600 - ((minX + maxX) / 2) * graphView.k;
    graphView.y = 380 - ((minY + maxY) / 2) * graphView.k;
    applyGraphView();
  }
  function centerOnNode(n) {
    graphSim.fitOnEnd = false;
    var k = Math.max(graphView.k, 1.15);
    graphView.k = k;
    graphView.x = 600 - n.x * k;
    graphView.y = 380 - n.y * k;
    applyGraphView();
  }
  function bindGraphInteraction() {
    var svg = $('#graphSvg');
    if (!svg || svg.__bound) return;
    svg.__bound = true;

    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0014));
    }, { passive: false });

    var pan = null;
    svg.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.gnode')) return;
      graphSim.fitOnEnd = false;
      pan = { x: e.clientX, y: e.clientY, vx: graphView.x, vy: graphView.y };
      svg.classList.add('dragging');
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    });
    svg.addEventListener('pointermove', function (e) {
      if (!pan) return;
      var m = svg.getScreenCTM();
      graphView.x = pan.vx + (e.clientX - pan.x) / m.a;
      graphView.y = pan.vy + (e.clientY - pan.y) / m.d;
      applyGraphView();
    });
    function endPan() { pan = null; svg.classList.remove('dragging'); }
    svg.addEventListener('pointerup', endPan);
    svg.addEventListener('pointercancel', endPan);

    window.addEventListener('pointermove', function (e) {
      if (!nodeDrag) return;
      var p = worldPoint(e.clientX, e.clientY);
      var n = nodeDrag.node;
      n.x = p.x; n.y = p.y; n.fx = p.x; n.fy = p.y;
      dragMoved = dragMoved || Math.abs(e.clientX - nodeDrag.sx) + Math.abs(e.clientY - nodeDrag.sy) > 4;
      updateNode(n);
      reheat(.35);
    });
    window.addEventListener('pointerup', function () {
      if (!nodeDrag) return;
      var d = nodeDrag;
      d.node.fx = null; d.node.fy = null;
      nodeDrag = null;
      if (!dragMoved) selectGraphNode(d.node, d.g);
      dragMoved = false;
      reheat(.3);
    });
  }
  function updateNode(n) {
    if (!graphRefs) return;
    var g = graphRefs.nodeEls[n.id];
    if (g) g.setAttribute('transform', 'translate(' + n.x.toFixed(2) + ',' + n.y.toFixed(2) + ')');
    for (var i = 0; i < graphRefs.lines.length; i++) {
      var l = graphRefs.lines[i];
      if (l.a === n) { l.el.setAttribute('x1', n.x.toFixed(1)); l.el.setAttribute('y1', n.y.toFixed(1)); }
      if (l.b === n) { l.el.setAttribute('x2', n.x.toFixed(1)); l.el.setAttribute('y2', n.y.toFixed(1)); }
    }
  }
  function reheat(alpha, fitOnEnd) {
    if (!graphRefs || !graphData) return;
    graphSim.fitOnEnd = !!fitOnEnd;
    graphSim.alpha = Math.max(graphSim.alpha || 0, alpha || .9);
    if (graphSim.running) return;
    graphSim.running = true;
    graphSim.raf = requestAnimationFrame(graphStep);
  }
  function graphStep() {
    if (!graphSim.running || !graphRefs) { graphSim.running = false; return; }
    var nodes = graphData.nodes;
    var links = graphData.edges.map(function (e) { return { a: graphRefs.nodeById[e.a], b: graphRefs.nodeById[e.b], w: e.kind === 'tt' ? 1.5 : 1 }; }).filter(function (l) { return l.a && l.b; });
    var alpha = graphSim.alpha;
    for (var i = 0; i < nodes.length; i++) {
      var a = nodes[i];
      for (var j = i + 1; j < nodes.length; j++) {
        var b = nodes[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < 36) { dx += .15; dy += .15; d2 = 36; }
        var d = Math.sqrt(d2);
        var mass = (a.type === 'tag' ? 1.35 : 1) * (b.type === 'tag' ? 1.35 : 1);
        var f = Math.min(2.2, 540 * mass / d2) * alpha;
        var fx = dx / d * f, fy = dy / d * f;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    links.forEach(function (l) {
      var dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var rest = (l.a.type === 'tag' && l.b.type === 'tag') ? 62 : 46;
      var f = (d - rest) * .014 * l.w * alpha;
      var fx = dx / d * f, fy = dy / d * f;
      l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
    });
    nodes.forEach(function (n) {
      if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; }
      else {
        n.vx += (n.theme.x - n.x) * .006 * alpha;
        n.vy += (n.theme.y - n.y) * .006 * alpha;
        n.vx += (600 - n.x) * .0005 * alpha;
        n.vy += (380 - n.y) * .0005 * alpha;
        n.x += n.vx * .5; n.y += n.vy * .5;
        n.vx *= .58; n.vy *= .58;
      }
      updateNode(n);
    });
    updateHalos();
    graphSim.alpha *= .975;
    if (graphSim.alpha > .02) graphSim.raf = requestAnimationFrame(graphStep);
    else { graphSim.running = false; graphSim.raf = 0; if (graphSim.fitOnEnd) { graphSim.fitOnEnd = false; fitView(); } }
  }
  function reLayout() {
    if (!graphData) return;
    graphData.nodes.forEach(function (n) {
      n.x += (Math.random() - .5) * 46;
      n.y += (Math.random() - .5) * 46;
      n.vx = 0; n.vy = 0;
    });
    graphSim.alpha = 1;
    reheat(1, true);
    showToast('正在重新布局');
  }
  function drawGraph() {
    var el = $('#view-graph');
    if (!el || !el.innerHTML) {
      graphData = buildGraph();
      el.innerHTML =
        '<div class="graph" id="graphShell">' +

          '<div class="graph-title"><h2>知识星图</h2><p id="graphStats">最近 ' + graphData.cards.length + ' 张卡 · ' + Object.keys(graphData.tags).length + ' 个主题标签 · ' + graphData.edges.length + ' 条连线</p></div>' +
          '<div class="legend" id="legend"></div>' +
          '<div class="graph-tools">' +
            '<div class="graph-search">' + icon('search') + '<input id="graphQ" placeholder="在星图里搜索" autocomplete="off"></div>' +

          '<div class="graph-hint">' + icon('external') + ' <b>滚轮</b>缩放 · <b>拖拽</b>平移 · <b>拖节点</b>移动 · <b>点击</b>查看</div>' +
        '</div>';
      var legend = $('#legend');
      var counts = {};
      graphData.nodes.forEach(function (n) {
        if (n.type === 'card') counts[n.theme.id] = (counts[n.theme.id] || 0) + 1;
      });
      legend.innerHTML = THEMES.filter(function (t) { return counts[t.id]; }).map(function (t) {
        return '<button data-theme="' + t.id + '" class="active"><i style="--c:' + t.color + '"></i>' + t.name + '<span class="n">' + counts[t.id] + '</span></button>';
      }).join('');
      $$('[data-theme]', legend).forEach(function (b) {
        b.onclick = function () {
          b.classList.toggle('active');

          $$('.gnode', el).forEach(function (n) {
            var th = n.getAttribute('data-theme');
            n.classList.toggle('dim', !on[th]);
          });
        };
      });
      $('#zoomIn').onclick = function () { zoomAt(600, 380, 1.25); };
      $('#zoomOut').onclick = function () { zoomAt(600, 380, .8); };
      $('#graphFit').onclick = function () { fitView(1); };
      $('#graphReheat').onclick = reLayout;
      var qi = $('#graphQ');
      qi.oninput = function () {
        var q = qi.value.trim().toLowerCase();
        $$('.gnode', el).forEach(function (n) {
          var hit = !q || (n.getAttribute('data-label') || '').toLowerCase().indexOf(q) >= 0;
          n.classList.toggle('dim', !hit);
        });
      };
      renderGraphSvg();
      bindGraphInteraction();
      applyGraphView();
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) fitView();
      else reheat(.55, true);
    }
  }
  function startNodeDrag(e, n, g) {
    e.preventDefault(); e.stopPropagation();
    hideGraphTip();
    dragMoved = false;
    graphSim.fitOnEnd = false;
    nodeDrag = { node: n, g: g, sx: e.clientX, sy: e.clientY };
    n.fx = n.x; n.fy = n.y;
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    reheat(.25);
  }
  function updateHalos() {
    if (!graphRefs || !graphData) return;
    var acc = {};
    graphData.nodes.forEach(function (n) {
      var a = acc[n.theme.id] || (acc[n.theme.id] = { x: 0, y: 0, n: 0 });
      a.x += n.x; a.y += n.y; a.n++;
    });
    graphRefs.halos.forEach(function (h) {
      var a = acc[h.theme];
      if (a && a.n) { h.el.setAttribute('cx', (a.x / a.n).toFixed(1)); h.el.setAttribute('cy', (a.y / a.n).toFixed(1)); }
    });
  }
  function renderGraphSvg() {
    var svg = $('#graphSvg');
    if (!svg || !graphData) return;
    var nodeById = {};
    graphData.nodes.forEach(function (n) { nodeById[n.id] = n; });
    var parts = [];
    parts.push('<defs>');
    THEMES.forEach(function (t, i) {
      parts.push('<radialGradient id="halo' + i + '"><stop offset="0" stop-color="' + t.color + '" stop-opacity=".10"/><stop offset=".6" stop-color="' + t.color + '" stop-opacity=".035"/><stop offset="1" stop-color="' + t.color + '" stop-opacity="0"/></radialGradient>');
    });
    parts.push('<filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');
    parts.push('</defs>');
    parts.push('<g id="gViewport">');
    THEMES.forEach(function (t, i) {
      var c = graphData.centroids[t.id];
      if (!c) return;
      var r = Math.max(105, Math.min(205, 60 + c.count * 6));
      parts.push('<circle class="ghalo" data-theme="' + t.id + '" cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="' + r + '" fill="url(#halo' + i + ')"/>');
    });
    graphData.edges.forEach(function (e) {
      var a = nodeById[e.a], b = nodeById[e.b];
      if (!a || !b) return;
      parts.push('<line class="gedge" data-a="' + esc(e.a) + '" data-b="' + esc(e.b) + '" x1="' + a.x.toFixed(1) + '" y1="' + a.y.toFixed(1) + '" x2="' + b.x.toFixed(1) + '" y2="' + b.y.toFixed(1) + '" stroke="' + (e.kind === 'tt' ? 'rgba(255,255,255,.11)' : 'rgba(255,255,255,.055)') + '" stroke-width="' + (e.kind === 'tt' ? '.8' : '.6') + '"/>');
    });
    graphData.nodes.forEach(function (n, i) {
      var color = n.theme.color;
      var label = n.type === 'tag' ? n.label : n.card.title;
      var op = n.type === 'tag' ? .95 : .72;
      var g = '<g class="gnode" data-id="' + esc(n.id) + '" data-theme="' + n.theme.id + '" data-label="' + esc(label) + '" data-type="' + n.type + '" transform="translate(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')" style="animation:fadeIn .5s ease both;animation-delay:' + Math.min(i * 5, 380) + 'ms">';
      g += '<circle class="node" cx="0" cy="0" r="' + n.r.toFixed(2) + '" fill="' + color + '" fill-opacity="' + op + '"' + (n.type === 'tag' ? ' filter="url(#softGlow)"' : '') + '/>';
      if (n.type === 'tag' && n.showLabel) {
        var lp = n.labelPos || { x: n.x, y: n.y + n.r + 11, anchor: 'middle' };
        g += '<text x="' + (lp.x - n.x).toFixed(1) + '" y="' + (lp.y - n.y).toFixed(1) + '" text-anchor="' + lp.anchor + '" font-size="9.5" fill="rgba(236,238,242,.58)" font-family="Inter, Segoe UI, Microsoft YaHei, sans-serif" letter-spacing=".02em">' + esc(n.label) + '</text>';
      }
      g += '</g>';
      parts.push(g);
    });
    parts.push('</g>');
    svg.innerHTML = parts.join('');

    graphRefs = { nodeById: nodeById, nodeEls: {}, lines: [], halos: [] };
    $$('.gnode', svg).forEach(function (g) {
      var n = nodeById[g.getAttribute('data-id')];
      if (!n) return;
      graphRefs.nodeEls[n.id] = g;
      g.onmouseenter = function (e) { showGraphTip(e, n); };
      g.onmousemove = function (e) { moveGraphTip(e); };
      g.onmouseleave = hideGraphTip;
      g.addEventListener('pointerdown', function (e) { startNodeDrag(e, n, g); });
    });
    $$('.ghalo', svg).forEach(function (h) { graphRefs.halos.push({ el: h, theme: h.getAttribute('data-theme') }); });
    $$('.gedge', svg).forEach(function (line) {
      var a = nodeById[line.getAttribute('data-a')], b = nodeById[line.getAttribute('data-b')];
      if (a && b) graphRefs.lines.push({ el: line, a: a, b: b });
    });
    updateHalos();
  }

        '<div class="status-card"><div class="sc-head">' + icon('backup') + '备份<span class="ok"></span></div><div class="sc-value">7 份</div><div class="sc-note">最新 10-20 03:07 · 保留 7 天</div></div>' +
        '<div class="status-card"><div class="sc-head">' + icon('zap') + '自动沉淀<span class="ok"></span></div><div class="sc-value">正常</div><div class="sc-note">最近成功 ' + esc(lastOk) + ' · deepseek-flash</div></div>' +
        '<div class="status-card"><div class="sc-head">' + icon('shield') + '版本<span class="ok"></span></div><div class="sc-value">v' + esc(D.version || '0.16.0') + '</div><div class="sc-note">宿主 / 常驻 / npm 一致</div></div>' +
      '</div>' +
      ledgerHtml +
      '<div class="status-cols">' +
        '<div class="panel">' +
          '<div class="panel-head"><h3>沉淀日志</h3><span class="meta">最近 40 条</span><div class="seg" id="actSeg"><button data-act="all" class="active">全部</button><button data-act="created">写卡</button><button data-act="skip">跳过</button></div></div>' +
          '<div class="panel-body timeline" id="timeline"></div>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px">' +
          '<div class="panel"><div class="panel-head"><h3>待审快照</h3><span class="meta">' + pendingTotal + ' 张</span></div><div class="panel-body side-list" id="sidePending"></div><div class="checkline">批准后才会进入记忆库<button class="btn" id="toAudit">去审核</button></div></div>' +
          '<div class="panel"><div class="panel-head"><h3>最近入库</h3><span class="meta">自动沉淀</span></div><div class="panel-body side-list" id="sideRecent"></div></div>' +
        '</div>' +
      '</div>';
    renderActivity();
    $$('#actSeg button').forEach(function (b) {
      b.onclick = function () {
        state.actFilter = b.getAttribute('data-act');
        $$('#actSeg button').forEach(function (x) { x.classList.toggle('active', x === b); });
        renderActivity();
      };
    });
    $('#toAudit').onclick = function () { setView('audit'); };
    $('#recheck').onclick = function () { showToast('检查完成，4 项均正常'); };
    var sp = $('#sidePending');
    sp.innerHTML = pendingCards.slice(0, 4).map(function (c) {
      var k = KIND[c.kind] || KIND.knowledge;
      return '<div class="side-item" data-pending="' + esc(c.path) + '"><span class="kind"><i style="--c:' + k.color + '"></i></span><span class="si-title">' + esc(c.title) + '</span><span class="si-time">' + shortTime(c.updated) + '</span></div>';
    }).join('');
    $$('[data-pending]', sp).forEach(function (x) {
      x.onclick = function () { state.auditSel = x.getAttribute('data-pending'); setView('audit'); };
    });
    $('#sideRecent').innerHTML = D.approved.slice(0, 5).map(function (c) {
      var k = KIND[c.kind] || KIND.knowledge;
      return '<div class="side-item" data-open="' + esc(c.path) + '"><span class="kind"><i style="--c:' + k.color + '"></i></span><span class="si-title">' + esc(c.title) + '</span><span class="si-time">' + shortTime(c.updated) + '</span></div>';
    }).join('');
    $$('#sideRecent [data-open]').forEach(function (x) {
      x.onclick = function () { openReader(x.getAttribute('data-open'), D.approved); };
    });
  }
  var ACT = {
    created: { label: '写卡', color: 'var(--green)' },
    listen: { label: '监听', color: 'var(--blue)' },
    skip: { label: '跳过', color: '#59616c' },
    boot: { label: '启动', color: 'var(--violet)' },
    warn: { label: '告警', color: 'var(--amber)' },
    fail: { label: '失败', color: 'var(--rose)' }
  };
  function renderActivity() {
    var list = (D.activity || []).filter(function (e) { return state.actFilter === 'all' || e.action === state.actFilter; });
    var el = $('#timeline');
    el.innerHTML = list.map(function (e) {
      var a = ACT[e.action] || { label: e.action, color: 'var(--text-3)' };
      return '<div class="tl-row"><span class="tl-time">' + shortTime(e.ts) + '</span><span class="tl-mark" style="--c:' + a.color + '"></span>' +
        '<div class="tl-text"><b>' + esc(a.label) + '</b> · ' + esc(nl(e.text)) +
        (e.preview ? '<span class="preview">' + esc(nl(e.preview)) + '</span>' : '') + '</div></div>';
    }).join('');
  }

  // ---------------- support / onboarding ----------------
  var GUIDE_KEY = 'me-guide-v5';
  var SUP = '../assets/support/';
  var README = 'https://github.com/EternalNight996/memory-eternal/blob/main/README.md';
  function openSupport(tab) {
    state.supportTab = tab || 'group';
    renderSupport();
    $('#supportOverlay').hidden = false;
  }
  function closeSupport() { $('#supportOverlay').hidden = true; }
  function renderSupport() {
    var tabs = [
      { id: 'group', label: '交流群' },
      { id: 'sponsor', label: '赞助' },
      { id: 'legacy', label: '旧程序' },
      { id: 'feedback', label: '异常反馈' }
    ];
    var body = '';
    if (state.supportTab === 'group') {
      body = '<p class="support-note">扫码进交流群，遇到问题可以直接问。</p>' +
        '<div class="support-qr"><figure><img src="' + SUP + 'group-qr.jpg" alt="交流群二维码"><figcaption>交流群</figcaption></figure></div>' +
        '<p class="support-note" style="margin-top:14px"><a class="support-link" href="' + README + '" target="_blank" rel="noreferrer">打开 README ↗</a></p>';
    } else if (state.supportTab === 'sponsor') {
      body = '<p class="support-note">如果这个插件帮你省了时间，可以请作者喝杯咖啡。完全自愿，不影响任何功能。</p>' +
        '<div class="support-qr"><figure><img src="' + SUP + 'wechat-pay.jpg" alt="微信收款码"><figcaption>微信收款码</figcaption></figure>' +
        '<figure><img src="' + SUP + 'wechat-reward.jpg" alt="微信赞赏码"><figcaption>微信赞赏码</figcaption></figure></div>' +
        '<p class="support-note" style="margin-top:14px">插件本体始终开源免费（MIT）。<br><a class="support-link" href="https://github.com/EternalNight996/memory-eternal/blob/main/SPONSOR.md" target="_blank" rel="noreferrer">SPONSOR.md ↗</a></p>';
    } else if (state.supportTab === 'legacy') {
      body = '<h3 style="margin:0 0 8px;font-size:14px">旧程序（dsh-desktop）已停止维护</h3>' +
        '<p class="support-note">作者自研的 dsh-desktop 已停止维护，官方 DeepSeek Harness 桌面版已覆盖同样能力，建议迁移。旧 profile 里如果还钉着已撤下的 dsh-desktop-shell@0.3.0，先删掉那套依赖，否则 pnpm install 会失败。</p>' +
        '<div class="support-actions" style="padding:0;border:0;margin-top:12px"><a class="btn" href="' + README + '" target="_blank" rel="noreferrer">' + icon('file') + '打开 README ↗</a>' +
        '<a class="btn" href="https://github.com/EternalNight996/memory-eternal/releases" target="_blank" rel="noreferrer">' + icon('external') + '历史版本 ↗</a></div>';
    } else {
      body = '<p class="support-note">遇到异常、想提需求，或者需要带上诊断信息，去 GitHub 提 issue。插件里不会内置 token，所以由你确认后提交。</p>' +
        '<div class="support-actions" style="padding:0;border:0"><a class="btn primary" href="https://github.com/EternalNight996/memory-eternal/issues/new/choose" target="_blank" rel="noreferrer">' + icon('external') + '打开 GitHub Issues ↗</a></div>' +
        '<p class="support-note" style="margin-top:14px">提交前请附上：版本号、复现步骤、期望行为；诊断信息里的 home 目录与 key/token 已脱敏。</p>';
    }
    var html = '<div class="support" role="dialog" aria-modal="true" aria-label="支持与交流">' +
      '<div class="support-head"><h3>💬 支持与交流</h3><button class="icon-btn support-close" id="supportClose" aria-label="关闭">✕</button></div>' +
      '<div class="support-tabs">' + tabs.map(function (x) {
        return '<button class="support-tab' + (state.supportTab === x.id ? ' active' : '') + '" data-stab="' + x.id + '">' + x.label + '</button>';
      }).join('') + '</div>' +
      '<div class="support-body">' + body + '</div>' +
      '<div class="support-actions">' +
        '<button class="btn" id="supportFeedback">' + icon('alert') + '异常反馈</button>' +
        '<button class="btn" id="supportReplay">✨ 重新查看引导</button>' +
        '<span class="spacer" style="flex:1"></span>' +
        '<span class="guide-tip">Demo 数据 · 不会写入真实记忆库</span>' +
      '</div>' +
    '</div>';
    var ov = $('#supportOverlay');
    ov.innerHTML = html;
    $('#supportClose').onclick = closeSupport;
    $$('[data-stab]', ov).forEach(function (b) {
      b.onclick = function () { state.supportTab = b.getAttribute('data-stab'); renderSupport(); };
    });
    $('#supportFeedback').onclick = function () { state.supportTab = 'feedback'; renderSupport(); };
    $('#supportReplay').onclick = function () { closeSupport(); openGuide(); };
    ov.onclick = function (e) { if (e.target === ov) closeSupport(); };
  }
  function openGuide() {
    state.guideStep = 0;
    renderGuide();
    $('#guideOverlay').hidden = false;
  }
  function closeGuide(save) {
    if (save) { try { localStorage.setItem(GUIDE_KEY, '1'); } catch (e) { /* 隐私模式忽略 */ } }
    $('#guideOverlay').hidden = true;
  }
  function renderGuide() {
    var steps = [
      { t: '自动沉淀，不用手动记', p: '每轮对话结束，值得留下的决策、根因和教训会被写成一张卡。先生成，再审核。', extra: '<div class="guide-chips"><span>自动沉淀</span><span>先审后入</span><span>只召回相关小块</span></div>' },
      { t: '读到有用的卡，点个 👍', p: '打开任意卡片，点 👍 有用 / 👎 没用。不用先搜索，按钮现在一直都在。它会帮助召回排序。', extra: '<div class="guide-like"><span class="thumb">👍</span> 有用</div>' },
      { t: '左侧新增支持入口', p: '交流群、赞助、旧程序、异常反馈都在左栏底部；需要帮助时不用翻 README。', extra: '<div class="guide-chips"><span>💬 交流群</span><span>☕ 赞助</span><span>🧩 旧程序</span><span>🐞 异常反馈</span></div>' }
    ];
    var i = state.guideStep;
    var s = steps[i];
    var last = i === steps.length - 1;
    var html = '<div class="guide" role="dialog" aria-modal="true" aria-label="首次使用引导">' +
      '<div class="guide-head"><b>✨ 30 秒认识记忆核心</b><span>你的 AI 会在每轮对话后自动沉淀知识卡，先审后入。</span></div>' +
      '<div class="guide-dots">' + steps.map(function (_, j) { return '<span class="guide-dot' + (j <= i ? ' on' : '') + '"></span>'; }).join('') + '</div>' +
      '<div class="guide-body"><h3>' + s.t + '</h3><p>' + s.p + '</p>' + s.extra + '</div>' +
      '<div class="guide-actions">' +
        '<button class="btn" id="guideSkip">跳过</button>' +
        '<span class="spacer"></span>' +
        '<span class="guide-tip">可以在「支持与交流」里重新打开</span>' +
        (i > 0 ? '<button class="btn" id="guideBack">上一步</button>' : '') +
        (last ? '<button class="btn primary" id="guideStart">开始使用</button>' : '<button class="btn primary" id="guideNext">下一步</button>') +
      '</div>' +
    '</div>';
    var ov = $('#guideOverlay');
    ov.innerHTML = html;
    $('#guideSkip').onclick = function () { closeGuide(true); };
    if ($('#guideBack')) $('#guideBack').onclick = function () { state.guideStep--; renderGuide(); };
    if ($('#guideNext')) $('#guideNext').onclick = function () { state.guideStep++; renderGuide(); };
    if ($('#guideStart')) $('#guideStart').onclick = function () { closeGuide(true); };
    ov.onclick = function (e) { if (e.target === ov) closeGuide(true); };
  }

  // ---------------- wiring ----------------
  function bindGlobal() {
    $$('.nav-item').forEach(function (b) {
      var v = b.getAttribute('data-view');
      if (!v) return;
      b.onclick = function () { setView(v); };
    });
    $$('[data-support]').forEach(function (b) {
      b.onclick = function () { openSupport(b.getAttribute('data-support')); };
    });
    $$('.mobile-nav button').forEach(function (b) {
      b.onclick = function () { setView(b.getAttribute('data-view')); };
    });
    $('#railToggle').onclick = function () {
      state.collapsed = !state.collapsed;
      $('#app').classList.toggle('collapsed', state.collapsed);
      $('#railToggle').setAttribute('aria-label', state.collapsed ? '展开侧栏' : '收起侧栏');
    };
    $('#topRecord').onclick = function () { showToast('演示模式：不会写入真实记忆库'); };
    $$('.icon-btn[title="快捷键"]').forEach(function (b) {
      b.onclick = function () { showToast('⌘ K 搜索 · J / K 切换 · A 批准 · R 驳回 · Esc 关闭'); };
    });
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName || '').toLowerCase();
      var typing = tag === 'input' || tag === 'textarea' || tag === 'select';
      if (e.key === 'Escape') {
        if (!$('#guideOverlay').hidden) { closeGuide(true); return; }
        if (!$('#supportOverlay').hidden) { closeSupport(); return; }
        if (!$('#overlay').hidden) { closeReader(); return; }
        if (typing) { e.target.blur(); return; }
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); setView('library');
        setTimeout(function () { var i = $('#search'); if (i) i.focus(); }, 30);
        return;
      }
      if (typing) return;
      if (e.key === '/') { e.preventDefault(); setView('library'); setTimeout(function () { var i = $('#search'); if (i) i.focus(); }, 30); return; }
      if (state.view === 'library' && !state.reader && (e.key === 'j' || e.key === 'J' || e.key === 'k' || e.key === 'K')) {
        var cards = $$('#grid .card');
        if (!cards.length) return;
        var cur = cards.indexOf(document.activeElement);
        var next = cur < 0 ? 0 : (e.key.toLowerCase() === 'j' ? Math.min(cards.length - 1, cur + 1) : Math.max(0, cur - 1));
        cards[next].focus();
        cards[next].scrollIntoView({ block: 'nearest' });
        e.preventDefault();
        return;
      }
      if (state.view === 'audit') {
        if (e.key === 'j' || e.key === 'J') { nextAudit(1); }
        if (e.key === 'k' || e.key === 'K') { nextAudit(-1); }
        if (e.key === 'a' || e.key === 'A') { decide(state.auditSel, 'approve'); }
        if (e.key === 'r' || e.key === 'R') { decide(state.auditSel, 'reject'); }
      }
    });
  }

  // boot
  syncCounts();
  mountLibrary();
  mountAudit();
  bindGlobal();
  var hv = (location.hash || '').replace('#', '');
  try {
    // 带 hash 深链时不弹首次引导：否则引导层挡住目标视图，新访客会以为 #graph 没渲染
    if (!localStorage.getItem(GUIDE_KEY) && !hv) setTimeout(openGuide, 900);
  } catch (e) { /* 隐私模式不弹 */ }
  if (!D.approved.length) {
    $('#grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>还没有数据</h3><p>先运行 preview/snapshot.mjs 生成本地快照。</p></div>';
  }
  // hash deep link
  if (hv && (VIEW_NAMES[hv] || hv === 'recycle' || hv === 'config')) setView(hv);
  window.addEventListener('hashchange', function () {
    var v = (location.hash || '').replace('#', '');
    if (v) setView(v);
  });
  $$('.nav-item').forEach(function (b) {
    var v = b.getAttribute('data-view');
    if (!v) return;
    b.addEventListener('click', function () { history.replaceState(null, '', '#' + v); });
  });
})();
</script>
</body>
</html>
