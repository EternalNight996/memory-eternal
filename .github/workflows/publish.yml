# 发布通道（2026-11-19 起，用户指令）：
#   · 正式版 / 补丁版 `vX.Y.Z` 推 tag → 本工作流 npm publish + provenance（必须先在对话里得到用户批准）
#   · 测试版 `vX.Y.Z-alpha.N` / `-beta.N` / `-rc.N` 推 tag → 只跑 build + tests，**不发布 npm**
#     测试版只发 GitHub Pre-release（scripts/release-test.mjs 创建），npm / Gitee 一律不动
#
# 用 OIDC trusted publishing 发 npm：不再需要 2FA-bypass token、不用手输 TOTP。

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包不发布（dry-run）'
        type: boolean
        default: true

# 同一 tag 只允许一个发布任务在跑；不要 cancel（发布中途取消会留下 staged 占位）
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # ← trusted publishing（OIDC）必需

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm 11.5+ 才内置 trusted publishing 支持；这里固定版本，避免最新版把行为改掉
      - name: Install npm with OIDC support
        run: npm i -g npm@^11.5.0

      # 构建与测试需要项目依赖（esbuild 等）；早先没有这一步，Build 直接 ERR_MODULE_NOT_FOUND
      - name: Install dependencies
        run: npm ci

      # 通道判定只看 package.json 版本，不看 ref 名（分支名带 `-` 不影响手动触发的 dry-run）
      - name: Detect release channel
        id: channel
        run: |
          set -e
          ver="$(node -p "require('./package.json').version")"
          case "$ver" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "测试版 $ver：只跑 build/tests，不发布 npm" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "正式版 $ver" ;;
          esac

      # 幂等：release.mjs 会先 npm publish 再推 tag，这里再发一次会 403；已存在就跳过
      - name: Check npm version
        id: npmcheck
        run: |
          set -e
          ver="$(node -p "require('./package.json').version")"
          if curl -fsS "https://registry.npmjs.org/@mengbot%2Fmem/${ver}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "npm 上已存在 ${ver}：跳过发布（release.mjs 或上一轮已发过）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ($tag) 与 package.json 版本 ($ver) 不一致，拒绝发布"
            exit 1
          fi

      - name: Ensure private modules are NOT in the package
        run: |
          set -e
          # 直接看 npm pack 清单里有没有私有文件（files 里的 ! 排除项是否生效）
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt >/dev/null
          if grep -qE 'cloud-(auth|server)\.js|docs/(CLOUD|PRIVATE)\.md|^\s*private/|^\s*runs/' /tmp/pack.txt; then
            echo "::error::私有文件出现在发布清单里"
            grep -E 'cloud-(auth|server)\.js|docs/(CLOUD|PRIVATE)\.md|private/|runs/' /tmp/pack.txt
            exit 1
          fi
          echo "打包清单干净"

      - name: Build
        run: node build.mjs

      - name: Unit tests
        run: node --test tests/*.test.mjs
        env:
          # 这些测试不需要真实网络；没有 key 的用例自身会 skip
          MEMORY_TEST: '1'

      - name: Publish (dry-run)
        if: ${{ steps.channel.outputs.prerelease != 'true' && steps.npmcheck.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish (OIDC trusted publishing)
        if: ${{ steps.channel.outputs.prerelease != 'true' && steps.npmcheck.outputs.exists != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: npm publish --access public --provenance

      - name: Summary
        if: ${{ success() && steps.channel.outputs.prerelease != 'true' && steps.npmcheck.outputs.exists != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          {
            echo "## ✅ Published memory-eternal@${{ github.ref_name }}"
            echo ""
            echo "- npm: https://www.npmjs.com/package/@mengbot/mem/v/$(node -p "require('./package.json').version")"
            echo "- 方式: OIDC trusted publishing（无长期 token、无 TOTP）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (already published — skipped)
        if: ${{ success() && steps.channel.outputs.prerelease != 'true' && steps.npmcheck.outputs.exists == 'true' }}
        run: |
          {
            echo "## ✅ Already published — npm publish skipped"
            echo ""
            echo "- version: $(node -p "require('./package.json').version")"
            echo "- npm 上已存在该版本（release.mjs 已发布），本工作流只做了 build/tests 校验。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (test version — npm skipped)
        if: ${{ success() && steps.channel.outputs.prerelease == 'true' }}
        run: |
          {
            echo "## 🧪 Test version — npm publish skipped"
            echo ""
            echo "- version: $(node -p "require('./package.json').version")"
            echo "- 测试版只发 GitHub Pre-release（scripts/release-test.mjs）；npm / Gitee 未动。"
          } >> "$GITHUB_STEP_SUMMARY"
