# 记忆核心（memory-eternal）bundle 补丁层。
# 安装后由 package.json 的 dsh.bundle.patch 自动生效；后层
# （profile 自己的 cordis.patch.yml / --patch）可按 id 覆盖或禁用本行。
#
# 客户端 UI（设置 → 记忆：统计 / 搜索 / 知识图谱）由 package.json 的
# dsh.client 元数据自动挂载，无需在此声明任何 client 行。

- insert:
    - id: memory-eternal
      name: memory-eternal
      config:
        # 不写 enabled：DSH 的插件启停开关与本字段同名，会互相覆盖（见 index.js Config 注释）
        autoCapture: true
        autoRecall: true
        vaultDir: ''
